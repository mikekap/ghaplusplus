[package]
name = "ghaplusplus-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ansi-to-html = "0.2.2"
js-sys = "0.3.103"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
chrono = "0.4.45"
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features=["registry", "std"] }
tracing-subscriber-wasm = "0.1.0"
console_error_panic_hook = "0.1.7"
html-escape = "0.2.14"
serde = "1.0.228"
serde-wasm-bindgen = "0.6.5"
reqwest = { version = "0.13.4", default-features = false }
