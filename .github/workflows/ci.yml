name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Test and build extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Install npm dependencies
        run: npm ci

      - name: Test Rust
        run: cargo test --locked --manifest-path wasm/Cargo.toml

      - name: Build WASM and TypeScript
        run: npm run build

      - name: Stage extension files
        run: |
          extension_dir="$RUNNER_TEMP/ghaplusplus"
          mkdir -p "$extension_dir"/{icons,dist/vendor,dist/wasm}
          cp manifest.json options.html popup.html worker-host.html "$extension_dir/"
          cp icons/ghaplusplus.png "$extension_dir/icons/"
          cp dist/*.js "$extension_dir/dist/"
          cp dist/vendor/*.js "$extension_dir/dist/vendor/"
          cp dist/wasm/*.js dist/wasm/*.wasm "$extension_dir/dist/wasm/"

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ghaplusplus-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/ghaplusplus/

      - name: Sign extension CRX
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          test -n "$CRX_PRIVATE_KEY" || { echo "CRX_PRIVATE_KEY secret is required"; exit 1; }
          umask 077
          key_file="$RUNNER_TEMP/ghaplusplus.pem"
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$CRX_PRIVATE_KEY" > "$key_file"
          unset CRX_PRIVATE_KEY
          google-chrome --headless --no-sandbox --no-message-box \
            --pack-extension="$RUNNER_TEMP/ghaplusplus" \
            --pack-extension-key="$key_file"
          test -s "$RUNNER_TEMP/ghaplusplus.crx"

      - name: Upload extension CRX
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/ghaplusplus.crx
          archive: false
          if-no-files-found: error
